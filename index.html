<style>
:root{--bg:#2b2b2b;--fg:#fff;--mut:#d6d6d6;--line:#000;--y:#f2f23a;--p:#3a2fc0;--g:#22e022;--m:#e030e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Arial,sans-serif;max-width:100%;overflow-x:hidden}
header{text-align:center;padding:20px 92px;border-bottom:2px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
header a{font-weight:800;font-size:clamp(16px,3.2vw,26px);letter-spacing:-.02em;text-transform:uppercase;cursor:pointer;text-decoration:none;color:var(--fg)}
main{padding:24px;max-width:1700px;margin:0 auto}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;margin:48px 0 16px;border-bottom:1px solid var(--line);padding-bottom:8px}
.bio{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.bio p{flex:1 1 360px;margin:0;font-size:clamp(15px,2vw,19px);line-height:1.55;max-width:70ch}
.bio.hidden p{display:none}
.bio.show p{animation:bin .8s steps(8) both}
@keyframes bin{0%{opacity:0;transform:translateX(-8px)}50%{opacity:.6;transform:translateX(5px)}100%{opacity:1;transform:none}}
.w{display:inline-block;white-space:nowrap}
.l{display:inline-block}
.fall .l{animation:fall 1.3s cubic-bezier(.5,0,.9,.6) var(--d) forwards}
@keyframes fall{0%{transform:none;opacity:1}12%{transform:translate(3px,0) skewX(14deg);color:var(--m);text-shadow:3px 0 var(--g),-3px 0 var(--p)}
28%{transform:translate(-3px,8px);color:var(--p);text-shadow:-3px 0 var(--y),3px 0 var(--m)}
100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0;color:var(--g);text-shadow:0 -6px var(--y)}}
.hl{display:inline-block;white-space:pre}
.hl.gl{animation:lg .3s steps(6)}
@keyframes lg{0%{transform:none}20%{transform:translate(-3px,1px) skewX(-12deg);color:var(--m);text-shadow:3px 0 var(--g),-3px 0 var(--p)}
45%{transform:translate(3px,-2px);color:var(--p);text-shadow:-3px 0 var(--y),3px 0 var(--m);clip-path:inset(40% 0 10% 0)}
70%{transform:translate(-2px,2px) skewX(10deg);color:var(--g);text-shadow:2px 0 var(--m),-2px 0 var(--y);clip-path:none}
100%{transform:none}}
.grid.big{display:block;columns:3;column-gap:20px}
@media (max-width:600px){.grid.big{column-gap:10px}.grid.big .tile{margin-bottom:10px}}
.grid.big .tile{aspect-ratio:auto;height:auto;break-inside:avoid;margin-bottom:20px}
.grid.big .tile img{height:auto}
.grid.big .tile.ph:nth-child(4n+1){aspect-ratio:3/4}
.grid.big .tile.ph:nth-child(4n+2){aspect-ratio:1/1}
.grid.big .tile.ph:nth-child(4n+3){aspect-ratio:4/5}
.grid.big .tile.ph:nth-child(4n){aspect-ratio:2/3}
button,.btn{font:inherit;font-size:13px;text-transform:uppercase;letter-spacing:.08em;background:var(--fg);color:var(--bg);border:0;padding:10px 16px;cursor:pointer}
button:hover,.btn:hover{background:var(--p);color:#fff}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.folder{position:relative;border:2px solid var(--line);padding:56px 16px 16px;min-height:150px;cursor:pointer;background:var(--bg);transition:transform .15s}
.folder::before{content:"";position:absolute;top:-2px;left:-2px;width:90px;height:24px;border:2px solid var(--line);border-bottom:0;background:var(--y)}
.folder:hover{transform:translate(-4px,-4px);box-shadow:6px 6px 0 var(--p)}
.folder b{display:block;font-size:15px;line-height:1.3}
.folder small{color:var(--mut);display:block;margin-top:8px}
.folder a{color:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{position:relative;aspect-ratio:3/4;overflow:hidden;cursor:pointer;background:#ccc}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.tile::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity .4s}
.tile:hover::after{opacity:1}
.tile:hover img{transform:scale(1.1)}
.vw{position:absolute;left:50%;top:50%;z-index:2;transform:translate(-50%,-30%);opacity:0;padding:12px 30px;border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;font-size:12px;letter-spacing:.3em;text-transform:uppercase;pointer-events:none;transition:opacity .4s,transform .5s cubic-bezier(.2,.8,.2,1)}
.tile:hover .vw{opacity:1;transform:translate(-50%,-50%)}
#lb{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
#lb.on{display:flex;animation:lbin .3s}
@keyframes lbin{from{opacity:0}}
#lb img{max-width:100%;max-height:100%;object-fit:contain}
#lb span{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:20px;color:#fff;font-size:12px;letter-spacing:.25em;text-transform:uppercase}
footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:20px 48px;max-width:1700px;margin:48px auto 0;padding:64px 24px calc(64px + env(safe-area-inset-bottom,0px));font-family:ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;font-size:14px;text-transform:uppercase;letter-spacing:.02em}
footer a{display:inline-block;color:var(--fg);text-transform:none;text-decoration:none;border-bottom:1px solid var(--fg)}
#hb{position:absolute;right:24px;top:50%;transform:translateY(-50%)}
.empty{aspect-ratio:3/4;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:13px;text-align:center;padding:8px}
.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
#fx{position:fixed;inset:0;z-index:99;pointer-events:none;opacity:0;clip-path:circle(0 at 50% 50%)}
#fx canvas{width:100%;height:100%;display:block;image-rendering:pixelated}
#fxt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;background:#000;padding:14px 22px;font-weight:800;font-size:clamp(18px,4vw,40px);text-transform:uppercase;letter-spacing:.04em;max-width:90vw}
#fxt i{display:block;font-style:normal;font-size:.4em;font-weight:400;margin-top:6px;letter-spacing:.2em}
#fxt.off{display:none}

linear-gradient(#fff,#fff) 8% 14%/3px 3px no-repeat,linear-gradient(#fff,#fff) 22% 40%/3px 3px no-repeat,linear-gradient(#fff,#fff) 37% 8%/3px 3px no-repeat,linear-gradient(#fff,#fff) 55% 28%/3px 3px no-repeat,linear-gradient(#fff,#fff) 68% 12%/3px 3px no-repeat,linear-gradient(#fff,#fff) 81% 36%/3px 3px no-repeat,linear-gradient(#fff,#fff) 93% 18%/3px 3px no-repeat,#0b1238}

<script>
var BIO="I have always been interested in art and creative work in different forms. My passion began with 13 years of playing the saxophone, which helped me develop my creativity and artistic sensitivity. In high school, studying Visual Arts allowed me to explore visual creation further. I then attended an art school for one year, where I discovered graphic, architectural  and fashion design. This experience allowed me to explore different fields and better define my direction. I eventually chose to focus on fashion, a field where I want to fully develop my creativity. I am currently in my second year of a Bachelor\u2019s degree at SUPMODE Bordeaux.";
var IG="https://www.instagram.com/shapsitaa/#";
// Pour ajouter des images en dur : mettre leurs adresses dans "images"
var P=[
{n:"ba 1 school project: jupe & top",k:"jupe",images:["jupe1.jpg","jupe2.jpg","jupe3.jpg","jupe4.jpg","jupe5.jpg","jupe6.jpg"]},
{n:"ba 2 school project: native spirit x supmode",k:"native",images:["native1.jpg","native2.jpg","native3.jpg","native4.jpg","native5.jpg"]},
{n:"double pockets short",k:"shorts",images:["shorts1.jpg","shorts2.jpg","shorts3.jpg","shorts4.jpg","shorts5.jpg","shorts6.jpg"]},
{n:"tartan hoodie",k:"hoodie",images:["hoodie1.jpg","hoodie2.jpg","hoodie3.jpg","hoodie4.jpg","hoodie5.jpg"]},
{n:"baggy jeans",k:"baggy",images:["baggy1.jpg","baggy2.jpg","baggy3.jpg","baggy4.jpg","baggy5.jpg","baggy6.jpg"]},
{n:"Caftan",k:"caftan",by:1,images:["caftan1.jpg","caftan2.jpg","caftan3.jpg","caftan4.jpg","caftan5.jpg"]},
{n:"white bootcut jean",k:"bootcut",by:1,images:["bootcut1.JPG","bootcut2.JPG","bootcut3.JPG","bootcut4.JPG","bootcut5.JPG","bootcut6.JPG","bootcut7.JPG"]}];

var view=null,bioOpen=true,showAnim=false;
function esc(c){return c=="<"?"&lt;":c==">"?"&gt;":c=="&"?"&amp;":c}
function letters(t){return t.split(/\s+/).map(function(w){return '<span class="w">'+w.split("").map(function(c){return '<span class="l">'+esc(c)+'</span>'}).join("")+'</span>'}).join(" ")}
var app=document.getElementById("app"),lb=document.getElementById("lb");
lb.onclick=function(){lb.classList.remove("on")};
addEventListener("keydown",function(e){if(e.key=="Escape")lb.classList.remove("on")});
function label(p){return p.n+(p.by?' shot by <a href="'+IG+'" target="_blank" rel="noopener">@shapsitaa</a>':"")}
function render(){
 if(view===null){
  var all=[];P.forEach(function(p,i){p.images.forEach(function(u){all.push({u:u,i:i})})});
  app.innerHTML='<div class="bio'+(bioOpen?"":" hidden")+(showAnim?" show":"")+'"><button id="tb">'+(bioOpen?"hide bio":"show bio")+'</button><p id="bp">'+letters(BIO)+'</p></div>'
  +'<h2>Projects</h2><div class="folders">'+P.map(function(p,i){return '<div class="folder" data-i="'+i+'"><b>'+label(p)+'</b><small>'+p.images.length+' image(s)</small></div>'}).join("")+'</div>'
  +'<h2>Gallery</h2><div class="grid big">'+(all.length?all.map(function(a){return '<div class="tile"><img src="'+a.u+'" alt=""><span class="vw">view</span></div>'}).join(""):Array(12).join("x").split("").map(function(){return '<div class="tile ph"></div>'}).join(""))+'</div>';
  showAnim=false;
  document.getElementById("tb").onclick=function(){
   var b=this;
   if(bioOpen){
    b.disabled=true;b.textContent="show bio";
    var bp=document.getElementById("bp");
    bp.querySelectorAll(".l").forEach(function(l){
     var rc=l.getBoundingClientRect();
     l.style.setProperty("--d",(Math.random()*1.1).toFixed(2)+"s");
     l.style.setProperty("--dx",(Math.random()*60-30|0)+"px");
     l.style.setProperty("--dy",Math.max(120,innerHeight-rc.top+60)+"px");
     l.style.setProperty("--r",(Math.random()*120-60|0)+"deg");
    });
    bp.classList.add("fall");
    setTimeout(function(){bioOpen=false;render()},2500);
   }else{bioOpen=true;showAnim=true;render()}
  };
 }else{
  var p=P[view];
  app.innerHTML='<div class="bar"><button id="bk">\u2190 back</button><label class="btn">+ add images<input id="up" type="file" accept="image/*" multiple hidden></label></div><h2 style="margin-top:20px">'+label(p)+'</h2><div class="grid big">'
  +(p.images.length?p.images.map(function(u){return '<div class="tile"><img src="'+u+'" alt=""><span class="vw">view</span></div>'}).join(""):'<div class="empty">Dossier vide \u2013 clique sur "+ add images"</div>')+'</div>';
  document.getElementById("bk").onclick=function(e){go(e,null)};
  document.getElementById("up").onchange=function(e){Array.prototype.forEach.call(e.target.files,function(f){p.images.push(URL.createObjectURL(f))});render()};
 }
 window.scrollTo(0,0);document.getElementById('ft').style.display=view===null?'flex':'none';decorate();
}
app.addEventListener("click",function(e){
 if(e.target.closest("a"))return;
 var t=e.target.closest(".tile");
 if(t&&t.querySelector("img")){lb.querySelector("img").src=t.querySelector("img").src;lb.classList.add("on");return}
 var el=e.target.closest("[data-i]");if(el)go(e,+el.dataset.i);
});
document.getElementById("hb").onclick=function(e){if(view!==null)go(e,null);else window.scrollTo({top:0,behavior:"smooth"})};
document.getElementById("home").onclick=function(e){if(view!==null)go(e,null)};
// ---- transition glitch ----
var fx=document.getElementById("fx"),cv=fx.querySelector("canvas"),cx=cv.getContext("2d"),fxt=document.getElementById("fxt"),pct=document.getElementById("pct"),timer=null;
var COL=["#5dbb3c","#7a5230","#8a8a8a","#4ee3e0","#e8661c","#2f5fd0","#ffffff","#222","#fcee4b"];
function size(){cv.width=Math.ceil(innerWidth/4);cv.height=Math.ceil(innerHeight/4)}
function paint(){
 var w=cv.width,h=cv.height,y=0;
 while(y<h){var bh=1+Math.random()*5|0,x=Math.random()*w*.4|0,c=COL[Math.random()*COL.length|0];
  cx.fillStyle=c;cx.fillRect(x,y,w*(.3+Math.random()*.7),bh);
  if(Math.random()<.5){cx.fillStyle=COL[Math.random()*COL.length|0];cx.fillRect(Math.random()*w,y,Math.random()*w*.3,bh)}
  y+=bh}
 for(var k=0;k<8;k++){cx.fillStyle=COL[Math.random()*COL.length|0];var q=2+Math.random()*6|0;cx.fillRect(Math.random()*w|0,Math.random()*h|0,q,q)}
}
function start(){size();paint();timer=setInterval(paint,70)}
function stop(){clearInterval(timer)}
function fade(){fx.style.transition="opacity .35s";fx.style.opacity=0;setTimeout(stop,380)}
var pt=null;
function go(e,target){
 var x=e.clientX||innerWidth/2,y=e.clientY||innerHeight/2;
 var p=target===null?null:P[target];
 fxt.firstChild.textContent=p?p.n+(p.by?" shot by @shapsitaa":""):"Colin Parlant--Lheriteau";
 pct.textContent="0%";fxt.style.setProperty("--pc","0%");fxt.classList.remove("off");
 var n=0;clearInterval(pt);pt=setInterval(function(){n=Math.min(100,n+Math.ceil(Math.random()*10));pct.textContent=n+"%";fxt.style.setProperty("--pc",n+"%");if(n>=100)clearInterval(pt)},80);
 fx.style.transition="none";fx.style.opacity=1;fx.style.clipPath="circle(0px at "+x+"px "+y+"px)";
 void fx.offsetWidth;start();
 fx.style.transition="clip-path .5s ease-in";fx.style.clipPath="circle(150vmax at "+x+"px "+y+"px)";
 setTimeout(function(){view=target;render()},520);
 setTimeout(function(){fade();p?toast("Chest opened",p.n):toast("Back at spawn","Colin Parlant--Lheriteau")},1500);
}

// ---- lettres glitch sur tout élément cliquable ----
function wrap(node){Array.from(node.childNodes).forEach(function(n){
 if(n.nodeType==3){var f=document.createDocumentFragment();
  n.textContent.split(/(\s+)/).forEach(function(t){if(!t)return;
   if(/^\s+$/.test(t)){f.appendChild(document.createTextNode(t));return}
   var w=document.createElement("span");w.className="w";
   t.split("").forEach(function(c){var x=document.createElement("span");x.className="hl";x.textContent=c;w.appendChild(x)});
   f.appendChild(w)});
  n.replaceWith(f)}
 else if(n.nodeType==1&&n.tagName!="INPUT")wrap(n)})}
function decorate(){document.querySelectorAll("#app button,#app .btn,#app .folder b,footer a,header button").forEach(function(el){
 if(el.hasAttribute("data-g"))return;el.setAttribute("data-g","1");wrap(el)})}
setInterval(function(){
 var gs=document.querySelectorAll("[data-g]");if(!gs.length)return;
 var pick=[gs[Math.random()*gs.length|0]];
 gs.forEach(function(g){if(g.matches(":hover"))pick.push(g)});
 pick.forEach(function(g){
  var hov=g.matches(":hover");if(!hov&&Math.random()<.4)return;
  var L=g.querySelectorAll(".hl");if(!L.length)return;
  for(var k=0;k<(hov?2:1);k++){var i=Math.random()*L.length|0,c=function(j){return L[j]&&L[j].classList.contains("gl")};
   if(c(i)||c(i-1)||c(i+1))continue;
   (function(e){e.classList.add("gl");setTimeout(function(){e.classList.remove("gl")},320)})(L[i])}
 })},350);

(function(){

 h.innerHTML=t.split("").map(function(c){return '<span class="hl">'+esc(c)+'</span>'}).join("");

var AC=null;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume()}catch(e){}return AC}
addEventListener("pointerdown",ac);addEventListener("keydown",ac);
function noise(dur,type,f0,f1,v0,v1){var a=ac();if(!a)return;var n=a.sampleRate*dur|0,b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0),i,t=a.currentTime;
 for(i=0;i<n;i++)d[i]=Math.random()*2-1;
 var s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type=type;
 f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(f1,t+dur);
 g.gain.setValueAtTime(v0,t);g.gain.exponentialRampToValueAtTime(v1,t+dur);
 s.connect(f);f.connect(g);g.connect(a.destination);s.start(t)}
function tone(f,at,dur,v,type,f2){var a=ac();if(!a)return;var t=a.currentTime+at,o=a.createOscillator(),g=a.createGain();o.type=type||"triangle";
 o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
 o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur)}
function sfx(k){
 if(k=="hiss")noise(1,"highpass",2500,7000,.02,.3);
 else if(k=="boom"){noise(1.3,"lowpass",1200,50,1,.01);tone(110,0,.6,.9,"sine",30)}
 else if(k=="ding"){tone(659,0,.35,.18);tone(880,.12,.35,.18);tone(1319,.26,.6,.2)}}
var tto=null;
function toast(a,b){if(a.indexOf("Creeper")<0)sfx("ding");document.getElementById("tt").textContent=a;document.getElementById("td").textContent=b;var t=document.getElementById("toast");t.classList.add("on");clearTimeout(tto);tto=setTimeout(function(){t.classList.remove("on")},3600)}
var CM=["gdggggdg","gggggggg","gkkggkkg","gkkggkkg","gggkkggg","ggkkkkgg","ggkkkkgg","gdggggdg","..gggg..","..gdgg..","..gggg..","..gggg..","ggg..ggg","ggg..ggg"],CC={g:"#4fb83a",d:"#2e8a22",k:"#0a0a0a"};
function boom(c){sfx("boom");var r=c.getBoundingClientRect(),x=r.left+20,y=r.top+35;c.remove();
 document.documentElement.classList.add("shake");setTimeout(function(){document.documentElement.classList.remove("shake")},450);
 for(var i=0;i<20;i++){var d=document.createElement("i");d.className="pt";d.style.left=x+"px";d.style.top=y+"px";d.style.background=["#5dbb3c","#2e8a22","#222","#999","#fff"][i%5];document.body.appendChild(d);
  (function(d){requestAnimationFrame(function(){requestAnimationFrame(function(){d.style.transform="translate("+(Math.random()*320-160|0)+"px,"+(Math.random()*-240+60|0)+"px) rotate("+(Math.random()*360|0)+"deg)";d.style.opacity=0})});setTimeout(function(){d.remove()},950)})(d)}

function spawn(){
 var c=document.createElement("div"),cv=document.createElement("canvas"),g;c.className="creeper";cv.width=8;cv.height=14;g=cv.getContext("2d");
 CM.forEach(function(row,y){row.split("").forEach(function(ch,x){if(CC[ch]){g.fillStyle=CC[ch];g.fillRect(x,y,1,1)}})});
 c.appendChild(cv);document.body.appendChild(c);
 c.onclick=function(){if(c.classList.contains("bl"))return;c.classList.add("bl");sfx("hiss");toast("Creeper","Ssssssss...");setTimeout(function(){boom(c)},1000)};
 c.addEventListener("animationend",function(e){if(e.animationName=="walk"){c.remove();setTimeout(spawn,20000)}})}
setTimeout(spawn,12000);
